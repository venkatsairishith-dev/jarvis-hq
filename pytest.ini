[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# pytest-randomly shuffles the test order to expose order dependencies, but the seed is pinned so a run is reproducible on the
# same commit. Changing the number changes the order and may expose a new order dependency: do it on purpose.
# Do not block the plugin with `-p no:randomly`: the option below would then be unknown and pytest would exit with an error.
addopts = -p no:anyio --randomly-seed=20260731
norecursedirs = .* venv build dist node_modules .pytest_cache __pycache__ *.egg face
