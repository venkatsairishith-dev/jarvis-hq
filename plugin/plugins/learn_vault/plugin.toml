[plugin]
id = "learn_vault"
name = "Learn Vault"
description = "A study vault in Obsidian format: read, search and save Markdown notes, keep exercises and summaries, and track learning progress per topic inside one bound folder."
short_description = "Study notes, exercises and progress in an Obsidian-format vault."
keywords = ["study", "learn", "notes", "obsidian", "exercise", "quiz", "progress", "flashcards", "学习", "笔记", "练习"]
version = "0.1.0"
type = "plugin"
entry = "plugin.plugins.learn_vault:LearnVaultPlugin"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin_runtime]
enabled = true
auto_start = true
