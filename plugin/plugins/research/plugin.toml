[plugin]
id = "research"
name = "Research"
description = "Research a question on the web within fixed limits: every factual sentence cites a source and is checked against it with a local model; unconfirmed statements are labelled. Can hand the result to the deliverables plugin as a PDF report or an animated presentation."
short_description = "Bounded, cited and checked web research."
keywords = ["research", "find out", "sources", "citations", "report", "investigate", "compare", "latest"]
version = "0.1.0"
type = "plugin"
entry = "plugin.plugins.research:ResearchPlugin"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin_runtime]
enabled = true
auto_start = true
