[plugin]
id = "jarvis_bridge"
name = "JARVIS Bridge"
description = "Hands tasks the user gives N.E.K.O by voice or text to JARVIS, the owner's main agent, which plans them, uses the right sub-agents and tools, asks for approval where needed and verifies the result."
short_description = "Delegate real tasks (research, code, files, apps) to the JARVIS main agent and its sub-agents."
keywords = [
    "task", "do", "get done", "research", "code", "write", "fix", "build", "file", "folder", "open", "run",
    "search", "find", "organize", "download", "install", "agent", "jarvis", "delegate",
    "任务", "帮我", "完成", "研究", "代码", "文件", "打开", "查找", "整理", "委托", "智能体"
]
version = "0.1.0"
type = "plugin"
entry = "plugin.plugins.jarvis_bridge:JarvisBridgePlugin"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin_runtime]
enabled = true
auto_start = true
[plugin.ui]
enabled = true

[[plugin.ui.panel]]
id = "main"
title = "JARVIS"
entry = "ui/panel.tsx"
context = "dashboard"
permissions = ["state:read", "action:call"]
