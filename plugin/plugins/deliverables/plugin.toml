[plugin]
id = "deliverables"
name = "Deliverables"
description = "Make polished, animated PowerPoint decks and professional PDF reports from a structured outline, check them (text fit, schema, rendering, links, fonts) and open them or start the slideshow."
short_description = "Animated PPTX decks and PDF reports, checked before hand-over."
keywords = ["presentation", "ppt", "pptx", "powerpoint", "slides", "slideshow", "pdf", "report", "document", "deck"]
version = "0.1.0"
type = "plugin"
entry = "plugin.plugins.deliverables:DeliverablesPlugin"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin_runtime]
enabled = true
auto_start = true
