[plugin]
id = "desktop"
name = "Desktop"
description = "Neko's hands on this Windows PC: open websites and play YouTube in the owner's existing Chrome profiles, operate apps with the keyboard, mouse and accessibility tree, read-only PC checks, and a troubleshooter that backs up, fixes after approval and verifies. Every action is a JARVIS kernel job."
short_description = "Chrome profiles, apps, PC checks and safe repairs, through the JARVIS kernel."
keywords = ["open", "website", "youtube", "play", "song", "video", "chrome", "browser", "profile", "account", "app", "window",
            "click", "type", "press", "key", "error", "fix", "repair", "troubleshoot", "crash", "disk", "network", "process"]
version = "0.1.0"
type = "plugin"
entry = "plugin.plugins.desktop:DesktopPlugin"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin_runtime]
enabled = true
auto_start = true
