# JARVIS local models, profile vram8plus: a GPU with 6 GB free or more (MODEL_MATRIX.md). llama-swap over llama.cpp's
# Vulkan build (use a CUDA build on NVIDIA). -fa off is kept because flash attention broke output on one RDNA1 card; on
# other GPUs test with it on. Files: python jarvis\scripts\fetch_models.py --profile vram8plus. Speeds need a benchmark.
healthCheckTimeout: 240
logLevel: info

macros:
  # llama.cpp b11714 is the next build (2026-10-17: same accuracy, JSON validity and speed as b11669 on the Linux test
  # server; jarvis/tools/jarvis.lock.json). Switch these paths to b11714 only after it is fetched and smoke-tested here.
  # D50 footprint budget (owner, 2026-10-25: JARVIS may use 20% of the laptop): -t 3 caps llama-server at 3 threads (20% of this profile's machine, never more
  # than 3 of 16), one model loaded at a time (swap group), models unload after 120 s idle. The governor may lower -t for the next load (jarvis/tools/governor.py).
  server: D:\jarvis\tools\llama.cpp\b11669\vulkan\llama-server.exe --host 127.0.0.1 --port ${PORT} --jinja --no-webui -fa off -np 1 -t 3
  models: D:\jarvis\models\llm

models:
  # General, planning and summaries: Qwen3.5-9B (Apache-2.0), all layers on the GPU.
  qwen3.5-9b:
    cmd: ${server} -m ${models}\Qwen3.5-9B-Q4_K_M.gguf -ngl 99 -c 16384
    aliases: [general, local-general, router-llm]
    ttl: 120
  qwen-coder-1.5b:
    cmd: ${server} -m ${models}\qwen2.5-coder-1.5b-instruct-q4_k_m.gguf -ngl 99 -c 8192
    aliases: [code, local-code]
    ttl: 120
  qwen-math-1.5b:
    cmd: ${server} -m ${models}\Qwen2.5-Math-1.5B-Instruct-Q4_K_M.gguf -ngl 99 -c 4096
    aliases: [math, maths, local-math]
    ttl: 120

  # PC-task decision model: the alias "decider" (jarvis/plugins/desktop/decide.py DEFAULT_MODEL). It was missing from this
  # profile, so on this hardware every PC task fell back to "no plan" (MEM-M5, 2026-10-18).
  # Qwen3-4B-Instruct-2507 is the chosen decider (PC_CONTROL_BENCHMARK.md: 92.9% dev, 3.3 s median on a 4 GB GPU), all layers on the GPU.
  # The model files here are pinned in jarvis/tools/jarvis.lock.json (models/gguf/...); fetch them with the lock fetcher, not with
  # fetch_models.py --profile (that one only knows the models/llm set). NOT yet run on this hardware class.
  decider-qwen3-4b-2507:
    cmd: ${server} -m D:\jarvis\models\gguf\Qwen3-4B-Instruct-2507-Q4_K_M.gguf -ngl 99 -c 2048
    aliases: [decider]
    ttl: 120
  # Vision for one window (jarvis_node/vision.py, alias vision-ground; used only when OCR and UI Automation cannot name the
  # thing): UI-Venus-1.5-2B Q4_K_M + its F16 projector, both pinned in jarvis.lock.json (~2.1 GB). The projector runs on the CPU
  # and images are cut to 512 tokens, as measured on the laptop (1024 failed there). UNVERIFIED on this hardware class.
  vision-ui-venus-2b:
    aliases: [vision-ground, vision]
    cmd: ${server} -m D:\jarvis\models\gguf\ui-venus-1.5-2b\UI-Venus-1.5-2B-Q4_K_M.gguf --mmproj D:\jarvis\models\gguf\ui-venus-1.5-2b\mmproj-F16.gguf -ngl 99 -c 4096 --no-mmproj-offload --image-min-tokens 512 --image-max-tokens 512
    ttl: 120
  # Read my documents (jarvis/plugins/doc_reader; D48): LightOnOCR-3-0.8B Q4_K_M + F16 projector, English only, both pinned in
  # jarvis.lock.json (~0.7 GB). Kept on the CPU as measured on the owner's laptop (4 to 11 s a page) so the GPU stays with the other
  # models; NOT run on this hardware class.
  lightonocr-docreader:
    aliases: [docreader, ocr-docs]
    cmd: ${server} -m D:\jarvis\models\gguf\lightonocr-3-0.8b\LightOnOCR-3-0.8B.Q4_K_M.gguf --mmproj D:\jarvis\models\gguf\lightonocr-3-0.8b\LightOnOCR-3-0.8B.mmproj-f16.gguf -ngl 0 --no-mmproj-offload -c 4096
    ttl: 120

groups:
  specialists:
    swap: true
    exclusive: true
    members: [qwen3.5-9b, qwen-coder-1.5b, qwen-math-1.5b, decider-qwen3-4b-2507, vision-ui-venus-2b, lightonocr-docreader]
