# Neko local models, profile cpu16: CPU only, 12 GB RAM or more (NEKO_MODEL_MATRIX.md). llama-swap over llama.cpp's CPU build.
# Files: python jarvis\scripts\fetch_models.py --profile cpu16. Speeds are estimates until benchmarked on such a machine.
healthCheckTimeout: 240
logLevel: info

macros:
  # llama.cpp b11714 is the next build (2026-10-17: same accuracy, JSON validity and speed as b11669 on the Linux test
  # server; jarvis/tools/jarvis.lock.json). Switch these paths to b11714 only after it is fetched and smoke-tested here.
  server: D:\jarvis\tools\llama.cpp\b11669\cpu\llama-server.exe --host 127.0.0.1 --port ${PORT} --jinja --no-webui -np 1
  models: D:\jarvis\models\llm

models:
  # Generalist: Ling-3.0-tiny (MIT), a mixture of experts: 7.9B parameters in the file, 1.3B used per token, so it is fast
  # on a CPU once loaded (needs about 5-6 GB of RAM).
  ling-tiny:
    cmd: ${server} -m ${models}\Ling-3.0-tiny-Q4_K_M.gguf -c 8192
    aliases: [general, local-general]
    ttl: 300
  # Router and tool choice: Qwen3.5-4B (Apache-2.0).
  qwen3.5-4b:
    cmd: ${server} -m ${models}\Qwen3.5-4B-Q4_K_M.gguf -c 8192
    aliases: [router-llm, local-router]
    ttl: 300
  qwen-coder-1.5b:
    cmd: ${server} -m ${models}\qwen2.5-coder-1.5b-instruct-q4_k_m.gguf -c 8192
    aliases: [code, local-code]
    ttl: 300
  qwen-math-1.5b:
    cmd: ${server} -m ${models}\Qwen2.5-Math-1.5B-Instruct-Q4_K_M.gguf -c 4096
    aliases: [math, maths, local-math]
    ttl: 300

  # PC-task decision model: the alias "decider" (plugin/plugins/desktop/decide.py DEFAULT_MODEL). It was missing from this
  # profile, so on this hardware every PC task fell back to "no plan" (MEM-M5, 2026-10-18).
  # Qwen3-4B-Instruct-2507 is the chosen decider (PC_CONTROL_BENCHMARK.md: 92.9% dev, 90.0% held-out, 152/157 on the combined set); 2.5 GB file. On a CPU a plan (under 150
  # tokens) is slower than the laptop GPU's 3.3 s: expect seconds to tens of seconds, not measured.
  # The model files here are pinned in jarvis/tools/jarvis.lock.json (models/gguf/...); fetch them with the lock fetcher, not with
  # fetch_models.py --profile (that one only knows the models/llm set). NOT yet run on this hardware class.
  decider-qwen3-4b-2507:
    cmd: ${server} -m D:\jarvis\models\gguf\Qwen3-4B-Instruct-2507-Q4_K_M.gguf -c 2048
    aliases: [decider]
    ttl: 300
  # Vision for one window (jarvis_node/vision.py, alias vision-ground; used only when OCR and UI Automation cannot name the
  # thing): UI-Venus-1.5-2B Q4_K_M + its F16 projector, both pinned in jarvis.lock.json (~2.1 GB). The projector runs on the CPU
  # and images are cut to 512 tokens, as measured on the laptop (1024 failed there). UNVERIFIED on this hardware class.
  vision-ui-venus-2b:
    aliases: [vision-ground, vision]
    cmd: ${server} -m D:\jarvis\models\gguf\ui-venus-1.5-2b\UI-Venus-1.5-2B-Q4_K_M.gguf --mmproj D:\jarvis\models\gguf\ui-venus-1.5-2b\mmproj-F16.gguf -c 4096 --no-mmproj-offload --image-min-tokens 512 --image-max-tokens 512
    ttl: 300

groups:
  one-at-a-time:
    swap: true
    exclusive: true
    members: [ling-tiny, qwen3.5-4b, qwen-coder-1.5b, qwen-math-1.5b, decider-qwen3-4b-2507, vision-ui-venus-2b]
