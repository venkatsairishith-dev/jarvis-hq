<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- the same policy as src/renderer/index.html, so the harness refuses what the app refuses -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http: https:; media-src 'self' data: blob: http: https:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self' blob: data: http: https: ws: wss:; frame-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Ask panel harness</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; background: #6b7fa8; font-family: system-ui, sans-serif; }
      html.dark body { background: #1c2740; }
      #stage { position: fixed; inset: 0; display: grid; place-items: center; color: #fff; opacity: 0.4; }
    </style>
  </head>
  <body>
    <div id="stage">(the character would be here)</div>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
