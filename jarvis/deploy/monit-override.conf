# systemd drop-in for Ubuntu's monit.service: /etc/systemd/system/monit.service.d/override.conf
# Ubuntu's unit hides /home (ProtectHome=yes) and drops the capabilities needed to run alert scripts as another user, so Monit
# exits at start-up when its config refers to scripts under /home/ubuntu. These are the smallest changes that fix that:
# read-only home (the kernel data folder stays writable so the alert can be audited) and CAP_SETUID/CAP_SETGID for `as uid`.
[Service]
ProtectHome=read-only
ReadWritePaths=/home/ubuntu/.jarvis-kernel
CapabilityBoundingSet=CAP_DAC_READ_SEARCH CAP_NET_RAW CAP_SYS_PTRACE CAP_SETUID CAP_SETGID
