[plugin]
id = "local_team"
name = "Local Team"
description = "Small specialist models on this PC (code, maths, general) share a task; a public reasoning model can advise, but only through the local privacy gateway, so it sees placeholders like [PASSWORD_1] instead of private values."
short_description = "Private local specialist models with a redacted public adviser."
keywords = [
    "local model", "offline", "private", "password", "code", "math", "maths", "specialist", "team"
]
version = "0.1.0"
type = "plugin"
entry = "jarvis.plugins.local_team:LocalTeamPlugin"


[plugin_runtime]
enabled = true
auto_start = true
