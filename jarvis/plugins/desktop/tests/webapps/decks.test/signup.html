<!doctype html>
<html><head><title>Create your account - Decks</title></head>
<body>
<h1>Create your account</h1>
<form data-on-submit="submit:/auth/signup">
  <label for="em">Email</label><input id="em" type="text" name="email">
  <label for="pw">Password</label><input id="pw" type="password" name="password">
  <label for="pw2">Confirm password</label><input id="pw2" type="password" name="password2">
  <label><input id="terms" type="checkbox" name="terms" aria-label="I agree to the Terms of Service"> I agree to the Terms of Service</label>
  <button type="submit">Create account</button>
</form>
</body></html>
