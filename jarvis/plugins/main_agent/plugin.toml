[plugin]
id = "main_agent"
name = "Main Agent"
description = "Takes one task given by voice or text, plans it, picks the sub-agents that fit (reasoning, installed plugins, the web browser, JARVIS and its lab agents), runs independent steps in parallel and reports one combined result."
short_description = "Plan a multi-step task and run it with the right sub-agents."
keywords = [
    "task", "plan", "multi-step", "research", "then", "and then", "organize", "build", "write up", "look up and", "compare", "summarize", "automate", "get it done", "agent", "sub-agent", "delegate", "workflow"
]
version = "0.1.0"
type = "plugin"
entry = "jarvis.plugins.main_agent:MainAgentPlugin"


[plugin_runtime]
enabled = true
auto_start = true
