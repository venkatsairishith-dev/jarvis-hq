[plugin]
id = "deliverables"
name = "Deliverables"
description = "Make polished, animated PowerPoint decks and professional PDF reports from a structured outline, check them (text fit, schema, rendering, links, fonts) and open them or start the slideshow."
short_description = "Animated PPTX decks and PDF reports, checked before hand-over."
keywords = [
    "presentation", "ppt", "pptx", "powerpoint", "slides", "slideshow", "pdf", "report", "document", "deck"
]
version = "0.1.0"
type = "plugin"
entry = "jarvis.plugins.deliverables:DeliverablesPlugin"


[plugin_runtime]
enabled = true
auto_start = true
