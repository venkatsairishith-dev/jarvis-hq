<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neko</title>
<style>
  :root {
    --bg: #F6F7FB; --panel: rgba(255,255,255,.72); --text: #111827; --muted: #6B7280; --line: rgba(17,24,39,.08);
    --accent: #7C3AED; --accent2: #38BDF8; --ok: #10B981; --warn: #F59E0B; --bad: #EF4444; --face: #FFFFFF; --ink: #1F2937;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0B1020; --panel: rgba(21,28,48,.72); --text: #E8EEF8; --muted: #9AABC6; --line: rgba(232,238,248,.08);
      --face: #1B2440; --ink: #E8EEF8;
    }
  }
  :root[data-theme="dark"] { --bg: #0B1020; --panel: rgba(21,28,48,.72); --text: #E8EEF8; --muted: #9AABC6; --line: rgba(232,238,248,.08); --face: #1B2440; --ink: #E8EEF8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: radial-gradient(120% 80% at 50% 0%, color-mix(in srgb, var(--accent) 14%, var(--bg)) 0%, var(--bg) 60%);
         color: var(--text); font: 13px/1.45 "Segoe UI", system-ui, sans-serif; display: flex; flex-direction: column;
         align-items: center; padding: 14px 16px; gap: 10px; overflow: hidden; user-select: none; }
  .orb-wrap { position: relative; width: 148px; height: 148px; flex: none; margin-top: 4px; }
  button.orb { all: unset; cursor: pointer; position: absolute; inset: 0; border-radius: 50%; display: grid; place-items: center;
               background: radial-gradient(70% 70% at 35% 30%, color-mix(in srgb, var(--face) 92%, white) 0%, var(--face) 70%);
               box-shadow: 0 18px 40px -18px color-mix(in srgb, var(--accent) 55%, transparent), inset 0 0 0 1px var(--line);
               transition: transform .25s ease, filter .4s ease; }
  button.orb:hover { transform: scale(1.03); } button.orb:active { transform: scale(.97); }
  button.orb:focus-visible { outline: 3px solid var(--accent2); outline-offset: 4px; }
  .ring { position: absolute; inset: -7px; border-radius: 50%; border: 3px solid transparent; pointer-events: none; transition: border-color .4s; }
  svg.cat { width: 96px; height: 96px; overflow: visible; }
  .ear { fill: var(--accent); transition: fill .4s; } .ear-in { fill: color-mix(in srgb, var(--accent) 35%, var(--face)); }
  .head { fill: var(--face); stroke: color-mix(in srgb, var(--ink) 18%, transparent); stroke-width: 2; }
  .eye { fill: var(--ink); transform-origin: center; transform-box: fill-box; transition: transform .3s; }
  .lid { stroke: var(--ink); stroke-width: 3; stroke-linecap: round; fill: none; opacity: 0; }
  .mouth { stroke: var(--ink); stroke-width: 2.4; stroke-linecap: round; fill: none; transform-origin: center; transform-box: fill-box; }
  .blush { fill: #F472B6; opacity: .35; }
  .badge { position: absolute; right: 2px; top: 6px; width: 30px; height: 30px; border-radius: 50%; display: none; place-items: center;
           font-weight: 700; color: white; box-shadow: 0 4px 12px rgba(0,0,0,.2); }
  .zzz { position: absolute; right: 8px; top: -6px; color: var(--muted); font-weight: 600; display: none; }
  .zzz span { position: absolute; animation: float 3s infinite ease-in; opacity: 0; } .zzz span:nth-child(2) { animation-delay: 1s; } .zzz span:nth-child(3) { animation-delay: 2s; }
  @keyframes float { 0% { transform: translate(0,0) scale(.7); opacity: 0; } 30% { opacity: .9; } 100% { transform: translate(14px,-26px) scale(1.1); opacity: 0; } }
  @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.025); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent2) 45%, transparent); } 100% { box-shadow: 0 0 0 16px transparent; } }
  @keyframes talk { 0%,100% { transform: scaleY(.4); } 50% { transform: scaleY(1.4); } }
  @keyframes blink { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  .eye { animation: blink 5s infinite; }
  /* states */
  body[data-state="sleeping"] button.orb { animation: breathe 4s infinite ease-in-out; filter: saturate(.7); }
  body[data-state="sleeping"] .eye { display: none; } body[data-state="sleeping"] .lid { opacity: 1; } body[data-state="sleeping"] .zzz { display: block; }
  body[data-state="wake_listening"] button.orb { animation: pulse 2.2s infinite; }
  body[data-state="listening"] .ring { border-color: var(--accent2); animation: pulse 1.2s infinite; }
  body[data-state="listening"] .eye { transform: scale(1.15); }
  body[data-state="thinking"] .ring { border-color: var(--accent) transparent var(--accent2) transparent; animation: spin 1.4s linear infinite; }
  body[data-state="thinking"] .eye { transform: translateY(-3px); }
  body[data-state="working"] .ring { border-color: var(--accent) var(--accent) transparent transparent; animation: spin .9s linear infinite; }
  body[data-state="speaking"] .mouth { animation: talk .32s infinite; } body[data-state="speaking"] .ring { border-color: color-mix(in srgb, var(--accent2) 60%, transparent); }
  body[data-state="completed"] .ring { border-color: var(--ok); } body[data-state="completed"] .badge { display: grid; background: var(--ok); }
  body[data-state="completed"] .eye { transform: scaleY(.35); }
  body[data-state="needs_permission"] .ring { border-color: var(--warn); animation: pulse 1.6s infinite; } body[data-state="needs_permission"] .badge { display: grid; background: var(--warn); }
  body[data-state="error"] .ring { border-color: var(--bad); } body[data-state="error"] .badge { display: grid; background: var(--bad); }
  body[data-state="error"] .ear { fill: var(--bad); } body[data-state="error"] button.orb { filter: grayscale(.4); }
  .label { text-align: center; min-height: 54px; max-width: 100%; }
  .label b { display: block; font-size: 14px; letter-spacing: .01em; }
  .label p { margin: 2px 0 0; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .panel { width: 100%; background: var(--panel); backdrop-filter: blur(14px); border: 1px solid var(--line); border-radius: 14px; padding: 10px; display: none; }
  .panel.show { display: block; }
  .row { display: flex; gap: 6px; } .row + .row { margin-top: 6px; }
  input[type=text] { flex: 1; min-width: 0; border: 1px solid var(--line); background: transparent; color: var(--text); border-radius: 10px; padding: 8px 10px; font: inherit; }
  input[type=text]:focus { outline: 2px solid var(--accent2); outline-offset: 0; }
  .btn { all: unset; cursor: pointer; padding: 7px 11px; border-radius: 10px; background: var(--accent); color: white; font-weight: 600; font-size: 12px; text-align: center; }
  .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
  .btn.danger { background: var(--bad); } .btn:focus-visible { outline: 2px solid var(--accent2); outline-offset: 2px; }
  .btn[disabled] { opacity: .5; cursor: default; }
  .note { color: var(--muted); font-size: 11px; margin-top: 6px; min-height: 14px; }
  .foot { margin-top: auto; color: var(--muted); font-size: 10.5px; display: flex; gap: 10px; }
  .foot a { color: var(--muted); }
</style>
</head>
<body data-state="sleeping">
  <div class="orb-wrap">
    <div class="ring" aria-hidden="true"></div>
    <button class="orb" id="orb" aria-label="Neko. Click to give a task." title="Click to give Neko a task">
      <svg class="cat" viewBox="0 0 100 100" aria-hidden="true">
        <path class="ear" d="M18 44 L22 8 L44 26 Z"/><path class="ear" d="M82 44 L78 8 L56 26 Z"/>
        <path class="ear-in" d="M24 36 L26 16 L38 27 Z"/><path class="ear-in" d="M76 36 L74 16 L62 27 Z"/>
        <ellipse class="head" cx="50" cy="56" rx="38" ry="33"/>
        <ellipse class="eye" cx="36" cy="55" rx="4.5" ry="6"/><ellipse class="eye" cx="64" cy="55" rx="4.5" ry="6"/>
        <path class="lid" d="M30 56 Q36 60 42 56"/><path class="lid" d="M58 56 Q64 60 70 56"/>
        <ellipse class="blush" cx="27" cy="66" rx="6" ry="3.5"/><ellipse class="blush" cx="73" cy="66" rx="6" ry="3.5"/>
        <path class="mouth" d="M44 68 Q47 72 50 68 Q53 72 56 68"/>
      </svg>
    </button>
    <div class="badge" id="badge" aria-hidden="true">✓</div>
    <div class="zzz" aria-hidden="true"><span>z</span><span>z</span><span>z</span></div>
  </div>

  <div class="label" aria-live="polite"><b id="title">Neko</b><p id="detail">Connecting…</p></div>

  <div class="panel" id="taskPanel">
    <form class="row" id="taskForm" autocomplete="off">
      <input type="text" id="task" maxlength="2000" placeholder="Ask Neko to do something…" aria-label="Task for Neko">
      <button class="btn" type="submit" id="send">Go</button>
    </form>
    <div class="row"><a class="btn ghost" href="http://127.0.0.1:48911/" target="_blank" rel="noopener" style="flex:1">Talk (voice)</a></div>
    <div class="note" id="taskNote"></div>
  </div>

  <div class="panel" id="donePanel">
    <div class="row">
      <button class="btn" id="openBtn" style="flex:1">Open</button>
      <button class="btn ghost" id="folderBtn">Folder</button>
      <button class="btn ghost" id="againBtn">Make again</button>
    </div>
    <div class="row">
      <button class="btn ghost" id="upBtn" aria-label="This was good" title="This was good" style="flex:1">👍</button>
      <button class="btn ghost" id="downBtn" aria-label="This was not good" title="This was not good" style="flex:1">👎</button>
    </div>
    <div class="note" id="doneNote"></div>
  </div>

  <div class="panel" id="workPanel">
    <div class="row"><button class="btn danger" id="stopBtn" style="flex:1">Stop after this step</button></div>
    <div class="note" id="workNote"></div>
  </div>

  <div class="panel" id="permPanel">
    <div class="row"><a class="btn" href="http://127.0.0.1:8799/" target="_blank" rel="noopener" style="flex:1">Review in the JARVIS console</a></div>
    <div class="note">Approving needs your PIN there.</div>
  </div>

  <div class="foot"><span id="clock"></span><a href="/" title="Detailed status">status</a></div>

<script>
"use strict";
const TITLES = {sleeping: "Sleeping", wake_listening: "Listening for “Hey Neko”", waking: "Waking up", listening: "Listening",
  thinking: "Thinking", working: "Working", speaking: "Speaking", completed: "Done", needs_permission: "Needs your permission",
  error: "Something is wrong"};
const BADGE = {completed: "✓", needs_permission: "!", error: "×"};
const $ = (id) => document.getElementById(id);
let current = {state: "sleeping"};
let taskOpen = false;

function render(s) {
  current = s;
  document.body.dataset.state = s.state;
  $("title").textContent = TITLES[s.state] || s.state;
  $("detail").textContent = [s.detail, s.recover].filter(Boolean).join(" · ");
  $("badge").textContent = BADGE[s.state] || "";
  $("clock").textContent = s.time ? "updated " + s.time : "";
  $("donePanel").classList.toggle("show", s.state === "completed" && !!s.file);
  $("workPanel").classList.toggle("show", s.state === "working");
  $("permPanel").classList.toggle("show", s.state === "needs_permission");
  $("taskPanel").classList.toggle("show", taskOpen && !["working", "needs_permission"].includes(s.state));
}

async function post(url, body) {
  const r = await fetch(url, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  return r.json().catch(() => ({ok: false, error: "no answer"}));
}

$("orb").addEventListener("click", () => {
  taskOpen = !taskOpen;
  render(current);
  if (taskOpen) setTimeout(() => $("task").focus(), 50);
});
$("taskForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const task = $("task").value.trim();
  if (!task) { $("taskNote").textContent = "Type the task first."; return; }
  $("send").disabled = true; $("taskNote").textContent = "Sending…";
  const r = await post("/api/task", {task, mode: "work"});
  $("send").disabled = false;
  $("taskNote").textContent = r.ok ? "Started." : (r.error || "Not accepted.");
  if (r.ok) { $("task").value = ""; taskOpen = false; }
});
async function action(name, note) {
  if (!current.file && name !== "stop") return;
  $(note).textContent = "…";
  const r = await post("/api/action", {action: name, path: current.file});
  $(note).textContent = r.ok ? (r.note || "Done.") : (r.error || "Not possible.");
}
$("openBtn").addEventListener("click", () => action("open", "doneNote"));
$("folderBtn").addEventListener("click", () => action("folder", "doneNote"));
$("againBtn").addEventListener("click", () => action("regenerate", "doneNote"));
$("stopBtn").addEventListener("click", () => action("stop", "workNote"));
async function feedback(rating) {
  const r = await post("/api/feedback", {rating, file: current.file || "", run_id: current.run_id || ""});
  $("doneNote").textContent = r.ok ? "Thanks, noted." : (r.error || "Not saved.");
}
$("upBtn").addEventListener("click", () => feedback("up"));
$("downBtn").addEventListener("click", () => feedback("down"));

let poller = null;
function poll() {
  fetch("/api/neko").then((r) => r.json()).then(render).catch(() => render({state: "error", detail: "The Neko state server is not answering."}));
}
function connect() {
  if (!window.EventSource) { poll(); poller = setInterval(poll, 3000); return; }
  const es = new EventSource("/api/events");
  es.onmessage = (e) => { try { render(JSON.parse(e.data)); } catch (_) {} };
  es.onerror = () => {                              // the server closes the stream every 10 minutes; reconnect, poll meanwhile
    es.close();
    if (!poller) { poll(); poller = setInterval(poll, 3000); }
    setTimeout(() => { clearInterval(poller); poller = null; connect(); }, 5000);
  };
}
connect();
</script>
</body>
</html>
