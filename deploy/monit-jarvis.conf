# Monit (Ubuntu package monit 5.33, AGPL-3+) watches the JARVIS services on the VM and tells the owner on Telegram.
# Install: sudo cp monit-jarvis.conf /etc/monit/conf.d/jarvis ; sudo chmod 600 /etc/monit/conf.d/jarvis ; sudo monit -t ; sudo systemctl reload monit
set daemon 60
set logfile /var/log/monit.log

# The alert script runs as the ubuntu user (it needs the Telegram secrets in ~/.jarvis/secrets).
# `fail` is sent when a check fails, `ok` when it recovers.

check system $HOST
  if memory usage > 92% for 5 cycles then exec "/usr/bin/python3 /home/ubuntu/jarvis/scripts/alert.py fail" as uid "ubuntu" and gid "ubuntu"
    else if succeeded then exec "/usr/bin/python3 /home/ubuntu/jarvis/scripts/alert.py ok" as uid "ubuntu" and gid "ubuntu"
  if swap usage > 60% for 5 cycles then exec "/usr/bin/python3 /home/ubuntu/jarvis/scripts/alert.py fail" as uid "ubuntu" and gid "ubuntu"

check filesystem rootfs with path /
  if space usage > 85% then exec "/usr/bin/python3 /home/ubuntu/jarvis/scripts/alert.py fail" as uid "ubuntu" and gid "ubuntu"
    else if succeeded then exec "/usr/bin/python3 /home/ubuntu/jarvis/scripts/alert.py ok" as uid "ubuntu" and gid "ubuntu"
  if inode usage > 85% then exec "/usr/bin/python3 /home/ubuntu/jarvis/scripts/alert.py fail" as uid "ubuntu" and gid "ubuntu"

check network tailscale0 with interface tailscale0
  if link down then exec "/usr/bin/python3 /home/ubuntu/jarvis/scripts/alert.py fail" as uid "ubuntu" and gid "ubuntu"
    else if succeeded then exec "/usr/bin/python3 /home/ubuntu/jarvis/scripts/alert.py ok" as uid "ubuntu" and gid "ubuntu"

check process jarvis_kernel matching "jarvis_kernel serve"
  start program = "/usr/bin/systemctl start jarvis-kernel"
  stop program = "/usr/bin/systemctl stop jarvis-kernel"
  if does not exist for 2 cycles then restart
  if does not exist for 1 cycles then exec "/usr/bin/python3 /home/ubuntu/jarvis/scripts/alert.py fail" as uid "ubuntu" and gid "ubuntu"
    else if succeeded then exec "/usr/bin/python3 /home/ubuntu/jarvis/scripts/alert.py ok" as uid "ubuntu" and gid "ubuntu"

check process jarvis_telegram matching "jarvis_kernel telegram"
  start program = "/usr/bin/systemctl start jarvis-telegram"
  stop program = "/usr/bin/systemctl stop jarvis-telegram"
  if does not exist for 2 cycles then restart

check process jarvis_llm matching "llama-server.*Qwen3-4B"
  start program = "/usr/bin/systemctl start jarvis-llm"
  stop program = "/usr/bin/systemctl stop jarvis-llm"
  if does not exist for 2 cycles then restart
  if does not exist for 1 cycles then exec "/usr/bin/python3 /home/ubuntu/jarvis/scripts/alert.py fail" as uid "ubuntu" and gid "ubuntu"
    else if succeeded then exec "/usr/bin/python3 /home/ubuntu/jarvis/scripts/alert.py ok" as uid "ubuntu" and gid "ubuntu"

check process jarvis_embed matching "llama-server.*bge-small"
  start program = "/usr/bin/systemctl start jarvis-embed"
  stop program = "/usr/bin/systemctl stop jarvis-embed"
  if does not exist for 2 cycles then restart
  if does not exist for 1 cycles then exec "/usr/bin/python3 /home/ubuntu/jarvis/scripts/alert.py fail" as uid "ubuntu" and gid "ubuntu"
    else if succeeded then exec "/usr/bin/python3 /home/ubuntu/jarvis/scripts/alert.py ok" as uid "ubuntu" and gid "ubuntu"

check process jarvis_smokescreen matching "smokescreen.*--listen-port 4750"
  start program = "/usr/bin/systemctl start jarvis-smokescreen"
  stop program = "/usr/bin/systemctl stop jarvis-smokescreen"
  if does not exist for 2 cycles then restart
  if does not exist for 1 cycles then exec "/usr/bin/python3 /home/ubuntu/jarvis/scripts/alert.py fail" as uid "ubuntu" and gid "ubuntu"
    else if succeeded then exec "/usr/bin/python3 /home/ubuntu/jarvis/scripts/alert.py ok" as uid "ubuntu" and gid "ubuntu"

check process tailscaled matching "tailscaled"
  start program = "/usr/bin/systemctl start tailscaled"
  stop program = "/usr/bin/systemctl stop tailscaled"
  if does not exist for 2 cycles then restart

# The nightly regression must keep producing results (newest file at most 36 hours old). Checked hourly.
check program nightly_fresh with path "/home/ubuntu/jarvis/scripts/check_nightly.sh" every 60 cycles
  if status != 0 then exec "/usr/bin/python3 /home/ubuntu/jarvis/scripts/alert.py fail" as uid "ubuntu" and gid "ubuntu"
    else if succeeded then exec "/usr/bin/python3 /home/ubuntu/jarvis/scripts/alert.py ok" as uid "ubuntu" and gid "ubuntu"
